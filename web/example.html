<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nmerkar — JavaScript target</title>
<style>
  html, body { margin: 0; height: 100%; font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  body { display: flex; flex-direction: column; }
  #bar { padding: 8px 12px; border-bottom: 1px solid #ccc; }
  #bar label { margin-right: 4px; }
  #src, #out { flex: 1; margin: 0; padding: 10px 12px; border: 0; resize: none; overflow: auto; font: inherit; box-sizing: border-box; }
  #src { border-bottom: 1px solid #ccc; }
  #out { white-space: pre-wrap; background: #f7f7f7; }
  button, select { font: inherit; }
</style>
</head>
<body>
<div id="bar"><label for="ex">example</label><select id="ex"></select> <button id="run">Run</button><span id="hint" style="color:#888"> Ctrl+Enter</span></div>
<textarea id="src" spellcheck="false"></textarea>
<pre id="out"></pre>
<!-- baked by web/build.sh: JSON object mapping example name to source text,
     taken from the repo's existing programs under examples/ -->
<script type="application/json" id="ex-samples">{"examples/hello": "\"hello, nmerkar\" print \n", "examples/fib": "; fib.n \u2014 iterative fibonacci via while with addr-bound cond/body labels\nentry:\n  0 v0!               ; v0 = F(k), starting at F(0) = 0\n  1 v1!               ; v1 = F(k+1), starting at F(1) = 1\n  20 v2!              ; v2 = iterations remaining\n  _addr v3            ; push address of the condition body (v3)\n  _addr v4            ; push address of the loop body (v4)\n  while               ; call v3 each round; run v4 until it returns 0\n  v0                 ; push the final F(20)\n  \"fib(20)=%d\" format ; render with the printf-style template\n  print               ; write the formatted string\n  ret                 ; return from the body (required at end of every body)\nv3:                   ; loop condition: continue while v2 > 0\n  v2 0 gt            ; push (v2 > 0)\n  ret\nv4:                   ; loop body: advance one fibonacci step\n  v0 v1 add v5!     ; v5 = v0 + v1 (the next value)\n  v1 v0!             ; v0 = v1\n  v5 v1!             ; v1 = v5\n  v2 1 sub v2!       ; v2 = v2 - 1\n  0                   ; body return value (discarded by while)\n  ret\n", "examples/dot": "1024 0 array v0! 1024 0 array v1! 0 v2! _addr v3 _addr v4 while 0 v5! _addr v6 _addr v7 while v5 \"dot=%d\" format print v3: v2 1024 lt ret v4: v0 v2 v2 set v1 v2 v2 2 mul set v2 1 add v2! 0 ret v6: v2 0 gt ret v7: v2 1 sub v2! v5 v0 v2 get v1 v2 get mul add v5! 0 ret \n", "examples/maptest": "dict v0! v0 \"a\" v0 \"a\" get_or_zero 1 add set v1! v0 \"b\" v0 \"b\" get_or_zero 1 add set v1! v0 \"a\" v0 \"a\" get_or_zero 1 add set v1! v0 \"c\" v0 \"c\" get_or_zero 1 add set v1! v0 \"a\" v0 \"a\" get_or_zero 1 add set v1! v0 \"b\" v0 \"b\" get_or_zero 1 add set v1! v0 \"a\" get_or_zero \"a=%d\" format print v0 \"b\" get_or_zero \"b=%d\" format print v0 \"c\" get_or_zero \"c=%d\" format print \n", "examples/matmul": "; matmul.n \u2014 128x128 matrix multiply with checksum\nv0:                              ; fill-phase row body (v1 = row index, pushed by for)\n  v1! 128 _addr v2 for           ; store the row index; run v2 once per column\n  ret                            ; return from the body (required at end of every body)\nv2:                              ; fill-phase cell body (v3 = column index)\n  v3!\n  v1 128 mul v3 add v4!        ; v4 = row*128 + col (flat index)\n  v5 v4 v1 v3 add set        ; A[v4] = row + col\n  v6 v4 v1 v3 sub set        ; B[v4] = row - col\n  ret\nv7:                              ; multiply-phase row body (v1 = row index)\n  v1! 128 _addr v8 for\n  ret\nv8:                              ; multiply-phase cell body (v3 = column index)\n  v3! 0 v9!                      ; store the column index; v9 = dot-product accumulator = 0\n  128 _addr v10 for              ; run v10 for each of the 128 k-steps\n  v11 v1 128 mul v3 add v9 set ; C[row*128+col] = v9\n  ret\nv10:                             ; dot-product step body (v12 = k index)\n  v12!\n  v5 v1 128 mul v12 add get   ; push A[row*128+k]\n  v6 v12 128 mul v3 add get   ; push B[k*128+col]\n  mul                            ; push the product\n  v9 add v9!                    ; v9 = product + v9\n  ret\nv13:                             ; checksum step body (v4 = element index)\n  v4! v11 v4 get v14 add v14! ; v14 = v14 + C[v4]\n  ret\nentry:\n  16384 0 array v5!              ; A = new int[16384], zero-filled (`0` = int type id)\n  16384 0 array v6!\n  16384 0 array v11!\n  128 _addr v0 for               ; fill A and B via row bodies\n  128 _addr v7 for               ; C = A\u00d7B via row bodies\n  0 v14!                         ; v14 = checksum accumulator\n  16384 _addr v13 for            ; sum all 16384 C elements into v14\n  v14                           ; push the checksum\n  \"checksum=%d\" format           ; render with the printf-style template\n  print\n  ret\n", "examples/memtest": "16 malloc v0! 1234 v0 store v0 load \"loadx=%d\" format print 16 buffer v1! 5678 v1 store 8 malloc v2! v2 v1 8 copy_memory v2 load \"bufcopy=%d\" format print v0 free v2 free \n", "examples/ring": "; ring.n \u2014 v13: spawn + channel, and a weave DAG\n; (the channel is a global: locals are frame-scoped and the post-weave\n;  code runs in its own body frame)\n'sender spawn ch!     ; spawn sender in a detached thread; ch (global) = its result channel\nweave                 ; begin task-DAG definition\n  task one:           ; task `one` \u2014 no inputs\n    ret 21            ; task result = 21\n  task two: one!      ; task `two` depends on `one`, binding its result to one\n    ret one 2 mul    ; task result = one * 2 = 42\nrun two               ; execute the DAG rooted at `two`; result lands on the stack\nprint                 ; prints the weave result (42)\nch dequeue print     ; join the spawned thread: dequeue its result (42) and print\nsender:               ; spawned thread body\n  ret 42              ; return value is enqueued to ch, then ch closes\n", "examples/strtest": "\"the cat sat on the mat the cat\" \" \" split v0! dict v1! v0 length v2! 0 v3! _addr v4 _addr v5 while v1 length \"unique=%d\" format print v1 \"the\" get_or_zero \"the=%d\" format print v1 \"cat\" get_or_zero \"cat=%d\" format print \"user=alice id=42\" \"user=([a-z]+) id=([0-9]+)\" regex_match v6# v6 length 0 gt _addr v7 _addr v8 if_else \"hello world\" \"(h)([a-z]+) (w)([a-z]+)\" \"\\\\3\\\\4 \\\\1\\\\2\" regex_replace \"swap=%s\" format print \"a1b22c333d\" \"[0-9]+\" regex_split \"|\" join \"rsplit=%s\" format print \"abcdef\" -3 6 slice \"slice1=%s\" format print \"abcdef\" 2 -1 slice \"slice2=%s\" format print \"abcdef\" 4 2 slice \"slice3=[%s]\" format print \"main.uf\" \"*.uf\" glob_match \"glob1=%d\" format print \"main.rs\" \"*.uf\" glob_match \"glob2=%d\" format print \"note.txt\" \"n?te.*\" glob_match \"glob3=%d\" format print \"hello world\" \"world\" find \"find=%d\" format print \"hello world\" \"pluto\" find \"miss=%d\" format print \"a-b-c\" \"-\" \"+\" replace_all \"repl=%s\" format print \"  padded  \" trim \"trim=[%s]\" format print \"MiXeD\" uppercase \"up=%s\" format print \"MiXeD\" lowercase \"down=%s\" format print \"prefix-body\" \"prefix\" starts_with \"starts=%d\" format print \"prefix-body\" \"body\" ends_with \"ends=%d\" format print \"x,y,,z\" \",\" split \";\" join \"sj=%s\" format print ret v4: v3 v2 sub ret v5: v0 v3 get v9! v1 v9 get_or_zero v10! v10 _addr v11 _addr v12 if_else v1 v9 v10 set v3 1 add v3! 0 ret v11: v10 1 add v10! 0 ret v12: 1 v10! 0 ret v7: v6 1 get v13! v6 2 get v14! v13 \"name=%s\" format print v14 \"id=%s\" format print 0 ret v8: \"match failed\" print 0 ret \n", "examples/weave": "; weave.n \u2014 v13: task DAG with input bindings\nweave                 ; begin task-DAG definition\n  task a:             ; task `a` \u2014 no inputs\n    ret 21            ; task result = 21\n  task b: a!          ; task `b` depends on `a`, binding its result to a\n    ret a 2 mul      ; task result = a * 2 = 42\n  task c: a! b!       ; task `c` depends on `a` and `b`, binding both results\n    ret a b add     ; task result = a + b = 63\nrun c                 ; execute the DAG rooted at `c`; result lands on the stack\nprint                 ; prints the weave result (63)\n\"63 expected (21 + 42)\" print ; sanity-check message\n", "examples/text/matmul": "; matmul.n \u2014 v12 text encoding: 128x128 C=A*B, checksum=2863136768\n\nfi:\n  row! 128 'fe for ret\nfe:\n  col! row 128  mul  col  add  ix!\n  A ix row col  add  set\n  B ix row col  sub  set ret\n\ncr:\n  row! 128 'dc for ret\ndc:\n  col! 0 acc! 128 'ij for\n  C row 128  mul  col  add  acc set ret\nij:\n  j! A row 128  mul  j  add  get\n  B j 128  mul  col  add  get\n   mul  acc  add  acc! ret\n\nse:\n  ix! C ix get total  add  total! ret\n\nentry:\n  16384 int array A! 16384 int array B! 16384 int array C!\n  128 'fi for\n  128 'cr for\n  0 total!\n  16384 'se for\n  total \"checksum=%d\" format print ret\n"}</script>
<script src="nk.js"></script>
<script>
(function () {
  "use strict";
  var src = document.getElementById("src");
  var out = document.getElementById("out");
  var sel = document.getElementById("ex");
  var btn = document.getElementById("run");
  var EX = JSON.parse(document.getElementById("ex-samples").textContent);
  var NAMES = Object.keys(EX);
  NAMES.forEach(function (n) {
    var o = document.createElement("option");
    o.value = n;
    o.textContent = n;
    sel.appendChild(o);
  });
  sel.value = NAMES[0];
  src.value = EX[NAMES[0]];
  sel.addEventListener("change", function () { src.value = EX[sel.value]; });
  function go() {
    out.textContent = "compiling…";
    nk.compile(src.value).then(function (prog) {
      out.textContent = "running…";
      return prog.run();
    }).then(function (r) {
      var t = (r.output || "") + (r.err || "");
      if (r.error) t += (t ? "\n" : "") + "nk: " + r.error;
      if (r.rc !== 0) t += "\n[exit " + r.rc + "]";
      out.textContent = t === "" ? "(no output)" : t;
    }).catch(function (e) {
      out.textContent = (e && e.message) ? e.message : String(e);
    });
  }
  btn.addEventListener("click", go);
  src.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); go(); }
  });
})();
</script>
</body>
</html>
