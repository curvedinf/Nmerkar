name: Unix QC

on:
  push:
    branches: [main, master, 'qc/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unix-qc-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.os }} / generated C
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: comp
      - name: Build both compilers
        working-directory: comp
        run: cargo build --release --bins
      - name: Compile and run language suite (CPU)
        run: python3 qc/unix.py comp/target/release/nk comp/target/release/nks
      - name: Stress default-GC large weave (t14, ten runs)
        if: matrix.os == 'ubuntu-24.04'
        working-directory: comp
        run: |
          for i in $(seq 1 10); do
            ./target/release/nk --device cpu tests/t14_task_gpu.n > /dev/null
          done

  distro:
    name: ${{ matrix.image }} / portable binary
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gcc libc6-dev python3
          - image: ubuntu:22.04
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gcc libc6-dev python3
          - image: fedora:42
            install: dnf install -y gcc glibc-devel python3
          - image: alpine:3.22
            install: apk add --no-cache gcc musl-dev python3
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: comp
      - name: Build portable compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          cargo build --release --bins --target x86_64-unknown-linux-musl --manifest-path comp/Cargo.toml
      - name: Test compiler inside distro
        env:
          IMAGE: ${{ matrix.image }}
          INSTALL: ${{ matrix.install }}
        run: |
          docker run --rm -e INSTALL -v "$GITHUB_WORKSPACE:/work" -w /work "$IMAGE" sh -ec '
            eval "$INSTALL"
            python3 qc/unix.py /work/comp/target/x86_64-unknown-linux-musl/release/nk /work/comp/target/x86_64-unknown-linux-musl/release/nks --quick
          '
