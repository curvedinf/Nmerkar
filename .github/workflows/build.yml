name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Native builds: compile directly on the matching runner.
  # Produces a binary named `nk` (nk.exe on Windows) for every major OS.
  native:
    name: Native ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: nk-linux-x86_64
            bin: nk
          - os: macos-latest
            artifact: nk-macos-arm64
            bin: nk
          - os: windows-latest
            artifact: nk-windows-x86_64
            bin: nk.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: comp

      - name: Build (release)
        working-directory: comp
        run: cargo build --release

      - name: Smoke test (--help)
        working-directory: comp
        run: ./target/release/${{ matrix.bin }} --help

      # Rename to `nk` (Windows already produces nk.exe)
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p staging
          cp comp/target/release/${{ matrix.bin }} staging/nk${{ matrix.bin == 'nk.exe' && '.exe' || '' }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: staging/*
          if-no-files-found: error

  # Intel macOS: GitHub retired the last Intel (macos-13) runners, so
  # cross-compile x86_64-apple-darwin on an arm64 runner. The Apple toolchain
  # links cross-arch natively; the smoke test runs under Rosetta 2 (preinstalled
  # on the arm64 runner images).
  cross-macos:
    name: Cross nk-macos-x86_64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: comp

      - name: Build (release)
        working-directory: comp
        run: cargo build --release --target x86_64-apple-darwin

      - name: Smoke test (--help, via Rosetta 2)
        run: comp/target/x86_64-apple-darwin/release/nk --help

      - name: Stage binary
        run: |
          mkdir -p staging
          cp comp/target/x86_64-apple-darwin/release/nk staging/nk

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: nk-macos-x86_64
          path: staging/nk
          if-no-files-found: error

  # Cross-compiled Linux builds using `cross` (Docker-based, handles the
  # linker/sysroot automatically). All produce a binary named `nk`.
  cross-linux:
    name: Cross ${{ matrix.artifact }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            artifact: nk-linux-arm64
          - target: armv7-unknown-linux-gnueabihf
            artifact: nk-linux-armv7
          - target: x86_64-unknown-linux-musl
            artifact: nk-linux-x86_64-musl
          - target: aarch64-unknown-linux-musl
            artifact: nk-linux-arm64-musl
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: comp

      - name: Build (release)
        working-directory: comp
        run: cross build --release --target ${{ matrix.target }}

      - name: Stage binary
        run: |
          mkdir -p staging
          cp comp/target/${{ matrix.target }}/release/nk staging/nk

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: staging/nk
          if-no-files-found: error
