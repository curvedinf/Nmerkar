name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Native builds: compile directly on the matching runner.
  # Unix artifacts contain both commands in the layout consumed by install.sh.
  native:
    name: Native ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: nmerkar-linux-x86_64
            bin: nk
          - os: macos-latest
            artifact: nmerkar-macos-arm64
            bin: nk
          - os: windows-latest
            artifact: nk-windows-x86_64
            bin: nk.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: comp

      - name: Build (release)
        working-directory: comp
        run: cargo build --release --bins

      - name: Smoke test (--help)
        working-directory: comp
        run: ./target/release/${{ matrix.bin }} --help

      - name: Package and test Unix installer
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p staging
          tar -czf staging/${{ matrix.artifact }}.tar.gz -C comp/target/release nk nks
          NK_INSTALL_ARCHIVE="$GITHUB_WORKSPACE/staging/${{ matrix.artifact }}.tar.gz" NK_INSTALL_DIR="$RUNNER_TEMP/nmerkar/bin" sh install.sh

      - name: Stage Windows binary
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p staging
          cp comp/target/release/nk.exe staging/nk.exe

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: staging/*
          if-no-files-found: error

  # Intel macOS: GitHub retired the last Intel (macos-13) runners, so
  # cross-compile x86_64-apple-darwin on an arm64 runner. The Apple toolchain
  # links cross-arch natively; the smoke test runs under Rosetta 2 (preinstalled
  # on the arm64 runner images).
  cross-macos:
    name: Cross nmerkar-macos-x86_64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: comp

      - name: Build (release)
        working-directory: comp
        run: cargo build --release --bins --target x86_64-apple-darwin

      - name: Smoke test (--help, via Rosetta 2)
        run: comp/target/x86_64-apple-darwin/release/nk --help

      - name: Package and test installer (Rosetta 2)
        run: |
          mkdir -p staging
          tar -czf staging/nmerkar-macos-x86_64.tar.gz -C comp/target/x86_64-apple-darwin/release nk nks
          arch -x86_64 env NK_INSTALL_ARCHIVE="$GITHUB_WORKSPACE/staging/nmerkar-macos-x86_64.tar.gz" NK_INSTALL_DIR="$RUNNER_TEMP/nmerkar/bin" sh install.sh

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: nmerkar-macos-x86_64
          path: staging/nmerkar-macos-x86_64.tar.gz
          if-no-files-found: error

  # Cross-compiled Linux builds using `cross` (Docker-based, handles the
  # linker/sysroot automatically). Both commands are packaged together.
  cross-linux:
    name: Cross ${{ matrix.artifact }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            artifact: nmerkar-linux-arm64
          - target: armv7-unknown-linux-gnueabihf
            artifact: nmerkar-linux-armv7
          - target: x86_64-unknown-linux-musl
            artifact: nmerkar-linux-x86_64-musl
          - target: aarch64-unknown-linux-musl
            artifact: nmerkar-linux-arm64-musl
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: comp

      - name: Build (release)
        working-directory: comp
        run: cross build --release --bins --target ${{ matrix.target }}

      - name: Package both compilers
        run: |
          mkdir -p staging
          tar -czf staging/${{ matrix.artifact }}.tar.gz -C comp/target/${{ matrix.target }}/release nk nks

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: staging/${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

  test-cross-linux:
    name: Install ${{ matrix.artifact }} in ${{ matrix.image }}
    needs: cross-linux
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: nmerkar-linux-arm64-musl
            runner: ubuntu-24.04-arm
            image: arm64v8/debian:bookworm
            qemu: false
          - artifact: nmerkar-linux-armv7
            runner: ubuntu-24.04
            image: arm32v7/debian:bookworm
            qemu: true
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
        if: matrix.qemu
        with:
          platforms: arm
      - uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: staging
      - name: Install in fresh container and run generated C
        env:
          IMAGE: ${{ matrix.image }}
          ARCHIVE: ${{ matrix.artifact }}.tar.gz
        run: |
          docker run --rm -e ARCHIVE -v "$GITHUB_WORKSPACE:/work" -w /work "$IMAGE" sh -ec '
            NK_INSTALL_ARCHIVE="/work/staging/$ARCHIVE" NK_INSTALL_DIR=/tmp/nmerkar/bin sh install.sh
            /tmp/nmerkar/bin/nk --device cpu '\''"cross architecture works" print'\''
          '
